<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARKUS OS • Floating Orb & Chat</title>
<style>
:root {
  --cyan: #00f0ff;
  --emerald: #00ff88;
  --amber: #ff9e3a;
  --bg-dark: #030712;
  --panel: rgba(15, 20, 35, 0.45);
  --ink: #e0e0e0;
  --muted: #8a8a9a;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at 50% 0%, #081025 0%, var(--bg-dark) 100%);
  font-family: inherit;
}

/* Canvas for Orb */
#orb-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 1;
  pointer-events: none;
}

/* Floating Orb Drag Handle */
#orb-draggable {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle at 30% 30%, var(--cyan), var(--emerald));
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
  cursor: grab;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}
#orb-draggable:active { cursor: grabbing; transform: scale(0.95); }
#orb-draggable::before {
  content: "●";
  font-size: 24px;
  color: var(--bg-dark);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* Chat Window */
#chat-window {
  position: fixed;
  top: 24px;
  right: 24px;
  width: 380px;
  height: 560px;
  background: var(--panel);
  border: 1px solid rgba(0, 240, 255, 0.2);
  border-radius: 12px;
  backdrop-filter: blur(12px);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
}

.chat-header {
  background: rgba(0, 240, 255, 0.08);
  border-bottom: 1px solid rgba(0, 240, 255, 0.15);
  padding: 12px 16px;
  color: var(--cyan);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.1em;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  font-size: 13px;
  line-height: 1.5;
}
.msg {
  margin-bottom: 10px;
  max-width: 90%;
  padding: 8px 12px;
  border-radius: 10px;
  word-wrap: break-word;
}
.msg.user {
  background: rgba(0, 240, 255, 0.15);
  align-self: flex-end;
  border-bottom-right-color: var(--cyan);
}
.msg.agent {
  background: rgba(0, 255, 136, 0.08);
  align-self: flex-start;
  border-bottom-left-color: var(--emerald);
}
.msg.system {
  background: rgba(255, 158, 58, 0.12);
  align-self: center;
  border: 1px solid rgba(255, 158, 58, 0.3);
  font-size: 0.85em;
  color: var(--amber);
}
.msg .meta {
  font-size: 0.7em;
  color: var(--muted);
  margin-top: 4px;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid rgba(0, 240, 255, 0.15);
  background: rgba(3, 7, 18, 0.5);
}
#chat-input {
  flex: 1;
  background: var(--panel);
  border: 1px solid rgba(0, 240, 255, 0.2);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}
#chat-input:focus { border-color: var(--cyan); }
#send-btn {
  background: linear-gradient(135deg, var(--emerald), var(--cyan));
  border: none;
  color: #000;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
}
#send-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 10px rgba(0, 255, 136, 0.3); }
#send-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Status Bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(0, 240, 255, 0.05);
  border-top: 1px solid rgba(0, 240, 255, 0.1);
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 8px var(--emerald);
  animation: pulse 1.5s infinite;
}
</style>
</head>
<body>

<!-- Orb Canvas -->
<canvas id="orb-canvas"></canvas>

<!-- Floating Orb (Drag Handle) -->
<div id="orb-draggable" title="MARKUS OS Orb"></div>

<!-- Chat Window -->
<div id="chat-window">
  <div class="chat-header">
    <span>PHX-OS</span>
    <span style="float:right; font-size:11px; color:var(--muted);">
      <span class="status-dot"></span> LIVE
    </span>
  </div>
  
  <div id="messages" class="messages">
    <div class="msg system">MARKUS OS online. Type your intent below.</div>
  </div>
  
  <div class="input-area">
    <textarea id="chat-input" placeholder="Dispatch intent... (Ctrl+Enter)" rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
  
  <div class="status-bar">
    <span>Model: <span id="model-name">—</span></span>
    <span>Ping: <span id="ping-time">—</span>ms</span>
  </div>
</div>

<script>
// Orb Animation
const canvas = document.getElementById('orb-canvas');
const ctx = canvas.getContext('2d');
let w, h, particles = [], startTime;
const PALETTE = { cyan: 'rgba(0, 240, 255, ', emerald: 'rgba(0, 255, 136, ' };

function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = w/2 + (Math.random()-0.5)*40;
    this.y = h/2 + (Math.random()-0.5)*40;
    this.angle = Math.random()*Math.PI*2;
    this.radius = 80 + Math.random()*120;
    this.speed = 0.005 + Math.random()*0.015;
    this.size = 1.2 + Math.random()*2.2;
    this.colorType = Math.random() > 0.3 ? 'cyan' : 'emerald';
    this.alpha = 0.2 + Math.random()*0.6;
  }
  update(t, pulse) {
    this.angle += this.speed;
    const rr = this.radius + Math.sin(t*2 + this.radius)*15 + pulse*25;
    this.x = w/2 + Math.cos(this.angle)*rr;
    this.y = h/2 + Math.sin(this.angle)*rr*0.8;
  }
  draw(ctx) {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = PALETTE[this.colorType] + this.alpha + ')';
    ctx.shadowBlur = 10; ctx.shadowColor = PALETTE[this.colorType] + '0.8)';
    ctx.fill(); ctx.shadowBlur = 0;
  }
}
for(let i=0; i<120; i++) particles.push(new Particle());

let energyPulse = 0, targetPulse = 0;
function drawOrb(cx, cy, radius, t) {
  ctx.save();
  const glow = ctx.createRadialGradient(cx, cy, radius*0.2, cx, cy, radius*1.8);
  glow.addColorStop(0, PALETTE.cyan + '0.4)');
  glow.addColorStop(0.5, PALETTE.emerald + '0.15)');
  glow.addColorStop(1, 'rgba(3, 7, 18, 0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, radius*1.8, 0, Math.PI*2); ctx.fill();
  
  const sphere = ctx.createRadialGradient(cx-radius*0.3, cy-radius*0.3, radius*0.1, cx, cy, radius);
  sphere.addColorStop(0, 'rgba(224, 242, 254, 0.9)');
  sphere.addColorStop(0.4, PALETTE.cyan + '0.6)');
  sphere.addColorStop(0.8, PALETTE.emerald + '0.4)');
  sphere.addColorStop(1, 'rgba(7, 16, 38, 0.95)');
  ctx.fillStyle = sphere; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fill();
  
  ctx.lineWidth = 1.5; ctx.strokeStyle = PALETTE.cyan + '0.5)';
  ctx.beginPath(); ctx.ellipse(cx, cy, radius*1.3, radius*0.4, t*0.6, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = PALETTE.emerald + '0.4)';
  ctx.beginPath(); ctx.ellipse(cx, cy, radius*1.5, radius*0.5, -t*0.4, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function animate() {
  requestAnimationFrame(animate);
  const t = (performance.now() - startTime) * 0.001;
  energyPulse += (targetPulse - energyPulse) * 0.05; targetPulse *= 0.96;
  
  ctx.fillStyle = 'rgba(3, 7, 18, 0.25)'; ctx.fillRect(0, 0, w, h);
  particles.forEach(p => { p.update(t, energyPulse); p.draw(ctx); });
  drawOrb(w/2, h/2, 70 + Math.sin(t*1.5)*6 + energyPulse*20, t);
}
startTime = performance.now(); animate();

// Drag Orb
const orb = document.getElementById('orb-draggable');
let dragStart = null;
orb.addEventListener('mousedown', e => { dragStart = { x: e.clientX, y: e.clientY }; });
document.addEventListener('mousemove', e => { if (dragStart) { const dx = e.clientX - dragStart.x; const dy = e.clientY - dragStart.y; orb.style.transform = `translate(${dx*0.5}px, ${dy*0.5}px)`; } });
document.addEventListener('mouseup', () => { dragStart = null; orb.style.transform = ''; });

// Chat
const messages = document.getElementById('messages');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const modelEl = document.getElementById('model-name');
const pingEl = document.getElementById('ping-time');

function addMsg(text, cls, meta) {
  const el = document.createElement('div');
  el.className = `msg ${cls}`;
  el.innerHTML = text + (meta ? `<div class="meta">${meta}</div>` : '');
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
}

async function sendIntent() {
  const prompt = input.value.trim();
  if (!prompt) return;
  addMsg(prompt, 'user', 'YOU');
  input.value = '';
  sendBtn.disabled = true;
  targetPulse = 1.5;
  
  const t0 = performance.now();
  try {
    const res = await fetch('http://localhost:8128/api/intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    const t1 = performance.now();
    pingEl.textContent = Math.round(t1-t0);
    
    if (data.kernel_response) addMsg(data.kernel_response, 'agent', 'MARKUS');
    if (data.routing_decision) {
      const r = data.routing_decision;
      addMsg(`[${r.model}] ${r.tier} • ${Math.round(r.confidence*100)}%`, 'agent', `Routing: ${r.reason}`);
    }
    modelEl.textContent = data.routing_decision?.model || data.routing?.model || 'MARKUS';
  } catch(e) {
    addMsg(`[Error] ${e.message}`, 'system', 'Connection failed');
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendIntent);
input.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') sendIntent(); });

// SSE Stream
const evtSource = new EventSource('http://localhost:8128/api/stream');
evtSource.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.event === 'intent') targetPulse = 1.8;
};
</script>

</body>
</html>
