<!doctype html>
<meta charset="utf-8"><title>MARKUS Run Trace</title>
<style>body{font:14px system-ui;background:#10141c;color:#e8edf5;margin:2rem}code,pre{white-space:pre-wrap}a{color:#8bd5ff}.event{border-left:2px solid #59d98e;padding:.4rem 1rem;margin:.5rem 0}.list{border-left:2px solid #6366f1;padding:.4rem 1rem;margin:.5rem 0}.run-item{margin:.2rem 0}</style>
<h1>MARKUS Run Trace</h1>
<p id="state">Loading…</p><main id="events"></main>
<script>
const params=new URLSearchParams(location.search);
const runId=params.get('run_id');
const state=document.querySelector('#state'), events=document.querySelector('#events');

function renderEvents(eventList){
  events.textContent='';
  eventList.forEach(e=>{
    const box=document.createElement('div'); box.className='event';
    const title=document.createElement('b'); title.textContent=`${e.sequence}. ${e.event_type}`;
    const time=document.createElement('small'); time.textContent=' '+new Date(e.created_at*1000).toISOString();
    const payload=document.createElement('pre'); payload.textContent=JSON.stringify(e.payload,null,2);
    box.append(title,time,document.createElement('br'),payload);
    events.append(box);
  });
}

function renderList(runs){
  events.textContent='';
  runs.forEach(r=>{
    const item=document.createElement('div'); item.className='list run-item';
    const link=document.createElement('a');
    link.textContent=`${r.run_id} · ${r.status} · ckpt: ${r.checkpoint||'none'}`;
    link.href='?run_id='+encodeURIComponent(r.run_id);
    item.append(link);
    events.append(item);
  });
}

if(!runId){
  fetch('/api/runs').then(r=>r.json()).then(d=>{
    state.textContent=`Last ${d.runs.length} runs`;
    renderList(d.runs);
  }).catch(e=>state.textContent='Trace unavailable: '+e);
}else{
  fetch('/api/runs/'+encodeURIComponent(runId)).then(r=>r.json()).then(d=>{
    state.textContent=`${d.run.run_id} · ${d.run.status} · checkpoint: ${d.run.checkpoint||'none'}`;
    renderEvents(d.events);
  }).catch(e=>state.textContent='Trace unavailable: '+e);
}
</script>
